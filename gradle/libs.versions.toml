[versions]
proguard = "7.8.1"
serialization = "1.11.0"
coroutines = "1.11.0"
revanced-patcher = "21.1.0-dev.5"
revanced-patcher-v22 = "22.0.2-dev.1"
morphe-patcher = "2.3.0"
morphe-library = "1.4.0"
# Commit hashes are not chronological versions; keep SDK transitives from overriding this pin.
arsclib = { strictly = "675bed2de3" }
kotlin = "2.4.10"
android-gradle-plugin = "9.2.1"
hidden-api-stub = "4.3.3"
xpp3 = "1.1.4c"
apksig = "9.0.0-rc03"

[libraries]
proguard = { module = "com.guardsquare:proguard-base", version.ref = "proguard" }
kotlin-metadata-jvm = { module = "org.jetbrains.kotlin:kotlin-metadata-jvm", version.ref = "kotlin" }
# Kotlinx
kotlinx-coroutines-core = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "serialization" }
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }

# Patcher
revanced-patcher = { group = "app.revanced", name = "revanced-patcher", version.ref = "revanced-patcher" }
revanced-patcher-v22 = { group = "app.revanced", name = "patcher", version.ref = "revanced-patcher-v22" }
morphe-patcher = { group = "app.morphe", name = "morphe-patcher", version.ref = "morphe-patcher" }
morphe-library = { group = "app.morphe", name = "morphe-library", version.ref = "morphe-library" }
arsclib = { module = "com.github.MorpheApp:ARSCLib", version.ref = "arsclib" }

# XMLPull
xpp3 = { group = "xpp3", name = "xpp3", version.ref = "xpp3" }

# HiddenAPI
hidden-api-stub = { group = "dev.rikka.hidden", name = "stub", version.ref = "hidden-api-stub" }

# Ackpine
apksig = { module = "com.android.tools.build:apksig", version.ref = "apksig" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
android-application = { id = "com.android.application", version.ref = "android-gradle-plugin" }
kotlin-parcelize = { id = "org.jetbrains.kotlin.plugin.parcelize", version.ref = "kotlin" }
