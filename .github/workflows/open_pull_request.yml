name: Open a PR to main

on:
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: dev-to-main-pr
  cancel-in-progress: false

jobs:
  pull-request:
    if: github.ref_name == 'dev' && github.event.deleted != true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Open draft pull request if needed
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: node .github/scripts/open-dev-pr.mjs
