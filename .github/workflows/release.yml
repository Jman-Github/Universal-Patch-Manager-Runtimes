name: Release
on:
  workflow_dispatch:
  push:
    branches: [main]
concurrency:
  group: runtime-release
  cancel-in-progress: false
permissions:
  contents: write
  packages: read
  issues: write
  pull-requests: write
  id-token: write
  attestations: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Validate release branch
        shell: bash
        run: |
          [[ "$GITHUB_REF_NAME" == main || "$GITHUB_REF_NAME" == dev ]] || exit 1
          [[ "$GITHUB_EVENT_NAME" != push || "$GITHUB_REF_NAME" == main ]] || exit 1
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: |
            25
            17
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platforms;android-37" "build-tools;36.0.0"
      - uses: burrunan/gradle-cache-action@v3.0.3
      - uses: actions/setup-node@v7
        with:
          node-version: "lts/*"
          cache: npm
      - run: npm ci
      - name: Test release automation
        run: |
          npm run test:release
          python3 -m unittest discover -s .github/scripts -p 'test_*.py'
      - name: Prepare release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE }}
        run: |
          test -n "$KEYSTORE_BASE64"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > keystore.jks
      - name: Semantic Release
        id: semantic-release
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GPR_USER: ${{ secrets.GPR_USER }}
          GPR_READ_PACKAGES_TOKEN: ${{ secrets.GPR_READ_PACKAGES_TOKEN }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEYSTORE_ENTRY_ALIAS: ${{ secrets.KEYSTORE_ENTRY_ALIAS }}
          KEYSTORE_ENTRY_PASSWORD: ${{ secrets.KEYSTORE_ENTRY_PASSWORD }}
          RUNTIME_SIGNER_SHA256: ${{ vars.RUNTIME_SIGNER_SHA256 }}
        run: |
          chmod +x gradlew
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          npm run release
      - uses: actions/upload-artifact@v7
        if: steps.semantic-release.outputs.released == 'true'
        with:
          name: runtime-releases
          path: runtime-release-assets/**/*
          if-no-files-found: error
          retention-days: 14
      - uses: actions/attest-build-provenance@v4
        if: steps.semantic-release.outputs.released == 'true'
        with:
          subject-path: runtime-release-assets/**/*.apk
